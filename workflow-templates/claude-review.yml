name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    uses: april-knights-solution/.github/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      release_impact: false
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
